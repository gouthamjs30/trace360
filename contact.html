<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sanskriti Labs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Sanskriti Labs</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Who Are We</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-form">
            <h1>Start the Conversation</h1>
            <p>Ready to reclaim your time and unlock new levels of efficiency? Reach out to us to begin your AI transformation journey.</p>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Company Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">How can we help?</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Sanskriti Labs. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
